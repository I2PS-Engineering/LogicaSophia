[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logicasophia"
version = "0.4.0"
description = "LogicaSophia standalone evidence-governed AI engineering agent"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logicasophia = "logicasophia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logicasophia = ["web/*.html", "web/*.css", "web/*.js", "web/*.webp"]
