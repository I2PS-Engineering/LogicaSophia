name: Remove redundant documentation branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'I2PS-Engineering/LogicaSophia'
    steps:
      - name: Delete redundant branch after main alignment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='docs/engineering-preview-v070-ownership'
          expected_sha='549ebc591c521e9e3459046e85676dfda7ccd654'
          branch_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)"
          if [[ "$expected_sha" != "$branch_sha" ]]; then
            echo 'Branch changed; keeping it for review' >&2
            exit 1
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          echo 'Removed redundant documentation branch; main unchanged.'
